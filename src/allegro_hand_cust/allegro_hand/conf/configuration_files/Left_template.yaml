## Template for adding Allegro Hand - LEFT hands

# Step 1 -Copy this file inside the folder conf/configuration_files and change the filename according to your hand_name. For instance V4R283.yaml
# Step 2 - Change the serial so it matches the hand serial name

# If your hand version is version 4 
#     Final step: Save the document and you are all set!

# If the hand version is 1, 2 or 3: 
#     Step 3 - Change the version parameter acordingly
#     Step 4 - Update the encoder offset, encoder direction and motor direction with the ones that the manufactureer provided you with.
#     Final step: Save the document and you are all set!

# Optional step: Change position and velocity filter coeficients (not recommended)

hand_info:
 control_period_s: 0.003
 DOF: 16
 robot_name: 'Allegro Hand'
 manufacturer: 'SimLab Co. Ltd.'
 origin: 'Seoul, South Korea'
 serial: 'R283'  # Step 2 - Change the serial so it matches the hand serial name
 version: 4.0    # Step 3 - Change the version parameter acordingly
 urdf_file: 'allegroHand_left.urdf'

# Step 4 - Update the encoder offset, encoder direction and motor direction with the ones that the manufactureer provided you with. (Current values are for version 4)
zero:
 encoder_offset:
  j00: 0
  j01: 0
  j02: 0
  j03: 0
  j10: 0
  j11: 0
  j12: 0
  j13: 0
  j20: 0
  j21: 0
  j22: 0
  j23: 0
  j30: 0
  j31: 0
  j32: 0
  j33: 0

 encoder_direction:
  j00: +1
  j01: +1
  j02: +1
  j03: +1
  j10: +1
  j11: +1
  j12: +1
  j13: +1
  j20: +1
  j21: +1
  j22: +1
  j23: +1
  j30: +1
  j31: +1
  j32: +1
  j33: +1

 motor_direction:
  j00: +1
  j01: +1
  j02: +1
  j03: +1
  j10: +1
  j11: +1
  j12: +1
  j13: +1
  j20: +1
  j21: +1
  j22: +1
  j23: +1
  j30: +1
  j31: +1
  j32: +1
  j33: +1

filter_coefs:
 position: [0.6, 0.198, 0.198]
 velocity: [0.6, 0.198, 0.198]
